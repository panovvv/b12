name: submit-application

on:
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-root

      - name: Check formatting (Black)
        run: poetry run black --check .

      - name: Submit application payload
        env:
          EMAIL: ${{ secrets.B12_EMAIL }}
          RESUME_LINK: ${{ secrets.B12_RESUME_LINK }}
          REPOSITORY_LINK: ${{ secrets.B12_REPOSITORY_LINK }}
          ACTION_RUN_LINK: ${{ secrets.B12_ACTION_RUN_LINK }}
          SIGNING_SECRET: ${{ secrets.B12_SIGNING_SECRET }}
        run: poetry run python scripts/submit_application.py
